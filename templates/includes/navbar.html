{% load static %}
<nav class="navbar navbar-expand-lg navbar-dark" style="background:#1a5c2e;box-shadow:0 2px 8px rgba(0,0,0,.2);">
  <div class="container-fluid px-3">

    <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" href="{% url 'dashboard' %}">
      <img src="{% static 'images/logo.jpg' %}" alt="MNHS" style="width:38px;height:38px;object-fit:contain;border-radius:50%;background:#fff;padding:2px;">
      <span style="font-size:1rem;letter-spacing:.01em;">MNHS AI School</span>
    </a>

    <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarTop">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarTop">
      <ul class="navbar-nav ms-auto align-items-center gap-1">
        <li class="nav-item">
          <a href="{% url 'event_list' %}" class="nav-link text-white position-relative"
             title="School Events">
            <i class="fa-solid fa-bell"></i>
            {% if events_this_week %}
            <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                  style="font-size:.6rem;">
              {{ events_this_week }}
            </span>
            {% endif %}
          </a>
        </li>
        <li class="nav-item">
          <span class="nav-link text-white-50 small">
            <i class="fa-solid fa-user-circle me-1"></i>
            {{ request.user.username }}
            <span class="badge ms-1" style="background:rgba(255,255,255,.2);font-size:.7rem;">
              {{ request.user.get_role_display }}
            </span>
          </span>
        </li>
        <li class="nav-item">
          <a href="{% url 'logout' %}" class="btn btn-sm ms-2"
             style="background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:8px;">
            <i class="fa-solid fa-right-from-bracket me-1"></i>Logout
          </a>
        </li>
      </ul>
    </div>

  </div>
</nav>
