{% extends "base.html" %}
{% block title %}{{ action }} Event{% endblock %}
{% block content %}
<div class="container mt-4" style="max-width:640px;">
  <div class="card border-0 shadow-sm">
    <div class="card-header fw-bold text-white"
         style="background:#1a5c2e;font-size:1.05rem;">
      <i class="fa-solid fa-calendar-plus me-2"></i>{{ action }} School Event
    </div>
    <div class="card-body p-4">
      <form method="post">
        {% csrf_token %}

        <div class="mb-3">
          <label class="form-label fw-semibold">Event Title <span class="text-danger">*</span></label>
          <input type="text" name="title" class="form-control" required
                 placeholder="e.g. Brigada Eskwela, Faculty Meeting"
                 value="{% if post %}{{ post.title }}{% elif event %}{{ event.title }}{% endif %}">
        </div>

        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="form-label fw-semibold">Date <span class="text-danger">*</span></label>
            <input type="date" name="event_date" class="form-control" required
                   value="{% if post %}{{ post.event_date }}{% elif event %}{{ event.event_date|date:'Y-m-d' }}{% endif %}">
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">
              Time <span class="text-muted fw-normal">(optional)</span>
            </label>
            <input type="time" name="event_time" class="form-control"
                   value="{% if post %}{{ post.event_time }}{% elif event %}{{ event.event_time }}{% endif %}">
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label fw-semibold">
            Description <span class="text-muted fw-normal">(optional)</span>
          </label>
          <textarea name="description" class="form-control" rows="4"
                    placeholder="Details about this event or meeting...">{% if post %}{{ post.description }}{% elif event %}{{ event.description }}{% endif %}</textarea>
        </div>

        <div class="d-flex gap-2">
          <button type="submit" class="btn fw-bold text-white px-4"
                  style="background:#1a5c2e;">
            <i class="fa-solid fa-check me-2"></i>{{ action }} Event
          </button>
          <a href="{% url 'event_list' %}" class="btn btn-outline-secondary px-4">
            Cancel
          </a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
