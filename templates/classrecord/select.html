{% extends "base.html" %}

{% block title %}Class Record{% endblock %}

{% block content %}

<div class="container mt-4">

    <h2>Class Record</h2>
    <p class="text-muted">Pick a student, subject, school year, and quarter to enter Written Work, Performance Task, and Quarterly Assessment scores.</p>

    <form method="POST" class="col-md-6">

        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit" class="btn btn-primary">
            Open Class Record
        </button>

    </form>

</div>

{% endblock %}
