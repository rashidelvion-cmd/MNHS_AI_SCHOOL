{% extends "base.html" %}

{% block title %}E-Class Record{% endblock %}

{% block content %}

<div class="container mt-4">

    <h2>E-Class Record</h2>
    <p class="text-muted">
        Select the class and the quarter/term to open the official DepEd
        E-Class Record grid for the whole section.
    </p>

    <form method="POST" class="col-md-6">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Open E-Class Record</button>
    </form>

</div>

{% endblock %}
